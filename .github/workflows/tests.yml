name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      # pymp-pypi is Linux and macOS only. The serial path of
      # surd.run_parallel is tested on every platform.
      - name: Install pymp (not on Windows)
        if: runner.os != 'Windows'
        run: python -m pip install pymp-pypi

      - name: Run the tests
        run: python -m pytest -v

  neural:
    name: surd.neural / ubuntu / py3.12
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU build of PyTorch, much smaller than the default CUDA build.
      - name: Install PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install . pytest

      - name: Run the tests of surd.neural and of the ties
        run: python -m pytest -v tests/test_neural.py tests/test_ties.py
