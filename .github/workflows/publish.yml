name: publish

# Builds the sdist and wheel on every GitHub release and uploads them to PyPI
# with trusted publishing (no API token). The upload step does nothing useful
# until the PyPI project "surd" exists and lists this repository, workflow
# (publish.yml) and environment (pypi) as a trusted publisher under
# https://pypi.org/manage/account/publishing/. Until then the job fails at
# the upload step and no release is published.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/surd/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
