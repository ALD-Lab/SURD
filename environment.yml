name: surd
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy
  - scipy
  - matplotlib
  - tqdm
  - jupyterlab
  - pip
  - pip:
      # Parallel loops in surd.run_parallel and examples E08 to E10.
      # Optional: without it, surd.run_parallel runs serially. Not available on Windows.
      - pymp-pypi; platform_system != "Windows"
      # The surd package itself, from this clone (run from the repository root).
      - -e .
# Example E07 (transport maps) also needs MParT:
#   conda install -c conda-forge mpart   (Linux, macOS x86-64)
#   pip install mpart                     (macOS ARM64)
